<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Tech News Statistics</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <h1>Most Used Tags (Last 30 Days)</h1>
    <canvas id="chart" width="800" height="800"></canvas>
    <script>
        new Chart(document.getElementById('chart'), {
            type: 'pie',
            data: {
                labels: ["ai","webdev","opensource","Another","csharp","dotnet","showdev","architecture","security","programming","performance","javascript","python","backend","mobile"],
                datasets: [{
                    data: [21,13,12,10,10,9,9,7,6,6,5,4,3,3,2]
                }]
            }
        });
    </script>
</body>
</html>
