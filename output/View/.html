<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Tech News Statistics</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <h1>Most Used Tags (Last 30 Days)</h1>
    <canvas id="chart" width="800" height="800"></canvas>
    <script>
        new Chart(document.getElementById('chart'), {
            type: 'pie',
            data: {
                labels: ["ai","opensource","Another","webdev","dotnet","csharp","hf26challenge","devops","devchallenge","security","architecture","performance","discuss","database","python"],
                datasets: [{
                    data: [30,13,13,13,12,10,10,10,9,7,7,6,6,5,4]
                }]
            }
        });
    </script>
</body>
</html>
