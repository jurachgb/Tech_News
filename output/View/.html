<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Tech News Statistics</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <h1>Most Used Tags (Last 30 Days)</h1>
    <canvas id="chart" width="800" height="800"></canvas>
    <script>
        new Chart(document.getElementById('chart'), {
            type: 'pie',
            data: {
                labels: ["ai","dotnet","csharp","webdev","architecture","programming","Another","opensource","security","performance","backend","database","aspnetcore","devops","games"],
                datasets: [{
                    data: [24,17,17,8,7,7,6,5,4,4,3,3,3,3,2]
                }]
            }
        });
    </script>
</body>
</html>
