<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Tech News Statistics</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <h1>Most Used Tags (Last 30 Days)</h1>
    <canvas id="chart" width="800" height="800"></canvas>
    <script>
        new Chart(document.getElementById('chart'), {
            type: 'pie',
            data: {
                labels: ["ai","dotnet","Another","webdev","opensource","csharp","programming","architecture","security","performance","agents","linux","backend","aspnetcore","devchallenge"],
                datasets: [{
                    data: [18,15,14,14,12,11,8,6,5,4,4,3,3,3,3]
                }]
            }
        });
    </script>
</body>
</html>
