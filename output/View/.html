<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Tech News Statistics</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <h1>Most Used Tags (Last 30 Days)</h1>
    <canvas id="chart" width="800" height="800"></canvas>
    <script>
        new Chart(document.getElementById('chart'), {
            type: 'pie',
            data: {
                labels: ["ai","dotnet","webdev","Another","csharp","programming","architecture","opensource","discuss","cloud","showdev","agents","linux","security","typescript"],
                datasets: [{
                    data: [23,13,12,11,10,8,6,5,5,4,4,4,3,3,3]
                }]
            }
        });
    </script>
</body>
</html>
