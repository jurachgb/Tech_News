<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Tech News Statistics</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <h1>Most Used Tags (Last 30 Days)</h1>
    <canvas id="chart" width="800" height="800"></canvas>
    <script>
        new Chart(document.getElementById('chart'), {
            type: 'pie',
            data: {
                labels: ["ai","opensource","dotnet","Another","webdev","devchallenge","hf26challenge","devops","csharp","security","architecture","programming","testing","games","performance"],
                datasets: [{
                    data: [26,18,15,14,11,11,11,11,10,6,5,5,4,3,3]
                }]
            }
        });
    </script>
</body>
</html>
