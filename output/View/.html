<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Tech News Statistics</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <h1>Most Used Tags (Last 30 Days)</h1>
    <canvas id="chart" width="800" height="800"></canvas>
    <script>
        new Chart(document.getElementById('chart'), {
            type: 'pie',
            data: {
                labels: ["ai","opensource","dotnet","security","webdev","csharp","programming","devops","php","Another","python","architecture","showdev","productivity","performance"],
                datasets: [{
                    data: [27,15,15,13,11,10,10,10,7,7,6,5,5,5,4]
                }]
            }
        });
    </script>
</body>
</html>
