<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Tech News Statistics</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <h1>Most Used Tags (Last 30 Days)</h1>
    <canvas id="chart" width="800" height="800"></canvas>
    <script>
        new Chart(document.getElementById('chart'), {
            type: 'pie',
            data: {
                labels: ["ai","Another","dotnet","webdev","opensource","csharp","devops","devchallenge","hf26challenge","security","programming","python","architecture","performance","javascript"],
                datasets: [{
                    data: [25,15,14,14,13,10,10,9,9,8,8,5,5,5,5]
                }]
            }
        });
    </script>
</body>
</html>
