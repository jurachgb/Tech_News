<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Tech News Statistics</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <h1>Most Used Tags (Last 30 Days)</h1>
    <canvas id="chart" width="800" height="800"></canvas>
    <script>
        new Chart(document.getElementById('chart'), {
            type: 'pie',
            data: {
                labels: ["ai","dotnet","opensource","Another","security","devops","csharp","architecture","programming","devchallenge","hf26challenge","webdev","softwareengineering","showdev","discuss"],
                datasets: [{
                    data: [26,14,13,12,11,11,10,6,6,6,6,5,4,4,4]
                }]
            }
        });
    </script>
</body>
</html>
