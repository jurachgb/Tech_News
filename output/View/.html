<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Tech News Statistics</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <h1>Most Used Tags (Last 30 Days)</h1>
    <canvas id="chart" width="800" height="800"></canvas>
    <script>
        new Chart(document.getElementById('chart'), {
            type: 'pie',
            data: {
                labels: ["ai","dotnet","opensource","csharp","Another","architecture","security","python","programming","webdev","backend","microsoft","c++","typescript","postgres"],
                datasets: [{
                    data: [21,16,12,10,8,7,6,5,5,4,2,2,2,2,2]
                }]
            }
        });
    </script>
</body>
</html>
