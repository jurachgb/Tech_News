<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Tech News Statistics</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <h1>Most Used Tags (Last 30 Days)</h1>
    <canvas id="chart" width="800" height="800"></canvas>
    <script>
        new Chart(document.getElementById('chart'), {
            type: 'pie',
            data: {
                labels: ["ai","architecture","webdev","opensource","csharp","devops","dotnet","Another","programming","productivity","security","performance","linux","cloud","javascript"],
                datasets: [{
                    data: [23,17,15,11,10,10,9,8,7,7,6,5,4,4,4]
                }]
            }
        });
    </script>
</body>
</html>
