<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Tech News Statistics</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <h1>Most Used Tags (Last 30 Days)</h1>
    <canvas id="chart" width="800" height="800"></canvas>
    <script>
        new Chart(document.getElementById('chart'), {
            type: 'pie',
            data: {
                labels: ["ai","opensource","dotnet","security","webdev","devops","csharp","Another","agents","aie","performance","architecture","javascript","programming","gamedev"],
                datasets: [{
                    data: [31,20,14,12,12,11,10,9,8,8,6,5,5,4,4]
                }]
            }
        });
    </script>
</body>
</html>
