<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Tech News Statistics</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <h1>Most Used Tags (Last 30 Days)</h1>
    <canvas id="chart" width="800" height="800"></canvas>
    <script>
        new Chart(document.getElementById('chart'), {
            type: 'pie',
            data: {
                labels: ["ai","Another","csharp","dotnet","programming","architecture","performance","security","opensource","llm","productivity","frontend","testing","database","devchallenge"],
                datasets: [{
                    data: [20,17,10,9,8,5,5,3,3,3,3,2,2,2,2]
                }]
            }
        });
    </script>
</body>
</html>
