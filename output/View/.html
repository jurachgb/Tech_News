<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Tech News Statistics</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <h1>Most Used Tags (Last 30 Days)</h1>
    <canvas id="chart" width="800" height="800"></canvas>
    <script>
        new Chart(document.getElementById('chart'), {
            type: 'pie',
            data: {
                labels: ["ai","dotnet","Another","csharp","security","architecture","opensource","webdev","programming","discuss","agents","games","backend","cloud","devops"],
                datasets: [{
                    data: [19,12,11,10,9,7,5,4,4,3,3,2,2,2,2]
                }]
            }
        });
    </script>
</body>
</html>
