<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Tech News Statistics</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <h1>Most Used Tags (Last 30 Days)</h1>
    <canvas id="chart" width="800" height="800"></canvas>
    <script>
        new Chart(document.getElementById('chart'), {
            type: 'pie',
            data: {
                labels: ["dotnet","ai","csharp","Another","opensource","architecture","security","performance","linux","backend","tutorial","c++","webdev","sqlserver","kaspa"],
                datasets: [{
                    data: [14,13,10,9,8,7,6,4,3,3,3,2,2,2,2]
                }]
            }
        });
    </script>
</body>
</html>
