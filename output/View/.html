<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Tech News Statistics</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <h1>Most Used Tags (Last 30 Days)</h1>
    <canvas id="chart" width="800" height="800"></canvas>
    <script>
        new Chart(document.getElementById('chart'), {
            type: 'pie',
            data: {
                labels: ["ai","opensource","security","webdev","dotnet","devops","csharp","programming","Another","architecture","devchallenge","hf26challenge","testing","performance","showdev"],
                datasets: [{
                    data: [23,18,16,14,13,11,11,10,9,8,6,6,6,5,4]
                }]
            }
        });
    </script>
</body>
</html>
