<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Tech News Statistics</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <h1>Most Used Tags (Last 30 Days)</h1>

        new Chart(document.getElementById('chart'), {

            data: {
                labels: ["ai","opensource","dotnet","security","devops","devchallenge","csharp","webdev","hf26challenge","architecture","Another","programming","productivity","backend","games"],
                datasets: [{
                    data: [28,18,13,11,11,10,10,10,8,6,5,5,4,3,3]
                }]
            }
        });
    </script>
</body>
</html>
