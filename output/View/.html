<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Tech News Statistics</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <h1>Most Used Tags (Last 30 Days)</h1>
    <canvas id="chart" width="800" height="800"></canvas>
    <script>
        new Chart(document.getElementById('chart'), {
            type: 'pie',
            data: {
                labels: ["ai","opensource","dotnet","programming","csharp","architecture","webdev","devchallenge","devops","performance","hf26challenge","security","Another","python","backend"],
                datasets: [{
                    data: [29,23,15,15,15,11,11,10,10,9,9,8,6,5,4]
                }]
            }
        });
    </script>
</body>
</html>
