<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Tech News Statistics</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

        new Chart(document.getElementById('chart'), {

            data: {
                labels: ["ai","opensource","security","dotnet","webdev","Another","devops","csharp","devchallenge","hf26challenge","programming","architecture","showdev","cloud","discuss"],
                datasets: [{
                    data: [29,21,15,13,12,11,11,10,8,8,6,5,5,4,4]
                }]
            }
        });
    </script>
</body>
</html>
