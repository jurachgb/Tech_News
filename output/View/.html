<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Tech News Statistics</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <h1>Most Used Tags (Last 30 Days)</h1>
    <canvas id="chart" width="800" height="800"></canvas>
    <script>
        new Chart(document.getElementById('chart'), {
            type: 'pie',
            data: {
                labels: ["ai","Another","webdev","csharp","dotnet","opensource","architecture","devchallenge","hf26challenge","security","javascript","performance","programming","productivity","discuss"],
                datasets: [{
                    data: [19,13,13,11,10,8,8,7,7,5,4,4,4,3,3]
                }]
            }
        });
    </script>
</body>
</html>
