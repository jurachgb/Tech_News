<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Tech News Statistics</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <h1>Most Used Tags (Last 30 Days)</h1>
    <canvas id="chart" width="800" height="800"></canvas>

        new Chart(document.getElementById('chart'), {

            data: {
                labels: ["ai","opensource","dotnet","Another","webdev","devops","csharp","devchallenge","hf26challenge","programming","testing","productivity","architecture","security","javascript"],
                datasets: [{
                    data: [31,18,15,12,12,11,10,8,8,7,6,6,5,5,5]
                }]
            }
        });
    </script>
</body>
</html>
