<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Tech News Statistics</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <h1>Most Used Tags (Last 30 Days)</h1>
    <canvas id="chart" width="800" height="800"></canvas>
    <script>
        new Chart(document.getElementById('chart'), {
            type: 'pie',
            data: {
                labels: ["ai","Another","devops","opensource","dotnet","webdev","hf26challenge","devchallenge","csharp","programming","security","cloud","backend","architecture","productivity"],
                datasets: [{
                    data: [25,15,11,11,11,11,9,8,7,7,6,5,4,4,4]
                }]
            }
        });
    </script>
</body>
</html>
