<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Tech News Statistics</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <h1>Most Used Tags (Last 30 Days)</h1>
    <canvas id="chart" width="800" height="800"></canvas>
    <script>
        new Chart(document.getElementById('chart'), {
            type: 'pie',
            data: {
                labels: ["ai","opensource","dotnet","Another","devops","csharp","webdev","discuss","security","backend","architecture","python","programming","devchallenge","hf26challenge"],
                datasets: [{
                    data: [36,15,14,11,11,10,10,7,6,5,5,5,5,5,5]
                }]
            }
        });
    </script>
</body>
</html>
