<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Tech News Statistics</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <h1>Most Used Tags (Last 30 Days)</h1>
    <canvas id="chart" width="800" height="800"></canvas>
    <script>
        new Chart(document.getElementById('chart'), {
            type: 'pie',
            data: {
                labels: ["ai","dotnet","csharp","Another","security","programming","opensource","games","linux","webdev","mobile","devops","architecture","frontend","agents"],
                datasets: [{
                    data: [24,11,10,7,6,6,5,5,4,4,3,3,3,2,2]
                }]
            }
        });
    </script>
</body>
</html>
