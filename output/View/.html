<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Tech News Statistics</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <h1>Most Used Tags (Last 30 Days)</h1>
    <canvas id="chart" width="800" height="800"></canvas>
    <script>
        new Chart(document.getElementById('chart'), {
            type: 'pie',
            data: {
                labels: ["ai","dotnet","devops","opensource","csharp","webdev","architecture","Another","programming","security","performance","discuss","productivity","frontend","javascript"],
                datasets: [{
                    data: [26,20,12,12,12,10,8,6,6,5,5,5,5,4,4]
                }]
            }
        });
    </script>
</body>
</html>
