<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Tech News Statistics</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <h1>Most Used Tags (Last 30 Days)</h1>
    <canvas id="chart" width="800" height="800"></canvas>
    <script>
        new Chart(document.getElementById('chart'), {
            type: 'pie',
            data: {
                labels: ["ai","opensource","dotnet","webdev","devchallenge","csharp","devops","security","architecture","hf26challenge","Another","programming","showdev","cloud","backend"],
                datasets: [{
                    data: [29,20,15,11,11,10,10,9,9,8,7,7,7,5,5]
                }]
            }
        });
    </script>
</body>
</html>
