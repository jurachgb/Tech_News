<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Tech News Statistics</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <h1>Most Used Tags (Last 30 Days)</h1>
    <canvas id="chart" width="800" height="800"></canvas>
    <script>
        new Chart(document.getElementById('chart'), {
            type: 'pie',
            data: {
                labels: ["ai","opensource","dotnet","security","devops","csharp","programming","architecture","webdev","linux","Another","backend","database","postgres","productivity"],
                datasets: [{
                    data: [24,17,14,12,11,10,9,8,6,4,4,4,4,4,4]
                }]
            }
        });
    </script>
</body>
</html>
