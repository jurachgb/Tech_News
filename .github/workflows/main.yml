name: Tech News Scraper

on:
  schedule:
    - cron: '0 9 * * *'  
  workflow_dispatch:      

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restaurar dependências
        run: dotnet restore TechNewsScraper.csproj

      - name: Build
        run: dotnet build src/TechNewsScraper/TechNewsScraper.csproj --no-restore --configuration Release

      - name: Executar scraper
        run: dotnet run --project src/TechNewsScraper/TechNewsScraper.csproj --configuration Release

      - name: Commitar resultados
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add output/
          git diff --staged --quiet || git commit -m "Atualização: $(date +'%d/%m/%Y %H:%M') UTC"
          git push
